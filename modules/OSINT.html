<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../js/auth_guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT & Threat Intelligence Arsenal</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon-main.svg">

    <link rel="stylesheet" href="../css/Footprinting.css">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <link rel="stylesheet" href="../css/resizer.css">
    <script src="../js/ui_popups.js"></script>
</head>

<body class="tab-tools">

    <div class="sidebar">
        <div class="header">
            <button onclick="toggleTheme()" class="theme-nav-btn" style="background: var(--text-main); color: var(--bg-base); border: 2px solid var(--text-main); font-family: 'Space Mono', monospace; font-weight: 700; font-size: 0.75rem; padding: 6px 10px; cursor: pointer; text-transform: uppercase; margin-left: auto;">🌓 Theme</button>
            <a href="../dashboard.html" class="back-dashboard-btn">⬅️ Back to Dashboard</a>
            <h2>OSINT & Threat Intelligence Arsenal</h2>
            <button class="add-tool-btn" onclick="openAddToolModal()">➕ Add Custom Tool</button>
        </div>
        <div class="tool-list" id="toolList"></div>
        <div class="sidebar-footer">
            <button id="completeModuleBtn" class="complete-btn" onclick="toggleModuleCompletion()">Mark Module Completed</button>
        </div>
    </div>
    <div class="resizer-v" id="sidebarResizer"></div>
    <div class="workspace">
        <div class="content-split">
            <div class="details-panel" id="detailsPanel">
                <div style="text-align: center; color: var(--text-muted); margin-top: 20vh;">
                    <h3>Select a tool from the menu to view beginner-friendly intelligence data.</h3>
                </div>
            </div>
            <div class="resizer-v" id="panelResizer"></div>
            <div class="chat-panel">
                <div class="chat-header" style="flex-direction: column; align-items: stretch; gap: 8px; padding: 12px 15px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                        <div class="status-container">
                            <div class="status-dot online" id="statusDot"></div>
                            OSINT Playground
                        </div>
                        <div class="local-badge">MODULE 07</div>
                    </div>
                </div>

                <!-- Chat Tab Content (only panel in this module — no Terminal/CTF, see project notes) -->
                <div id="chatTabContent" class="tab-content active" style="display: flex; flex-direction: column; flex-grow: 1; min-height: 0;">
                    <div class="chat-history" id="chatHistory">
                        <div class="msg bot">System Initialized. Don't know where to start? Ask me:
                            "How is crt.sh different from SecurityTrails?"</div>
                    </div>
                    <div class="chat-input-area">
                        <input type="text" id="chatInput" placeholder="Ask any beginner question here..."
                            onkeypress="handleEnter(event)">
                        <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="mobile-nav" id="mobileNav">
        <button class="nav-tab active" onclick="switchMobileTab('tools')">
            <span class="tab-icon">📁</span>
            <span class="tab-label">Tools</span>
        </button>
        <button class="nav-tab" onclick="switchMobileTab('details')">
            <span class="tab-icon">📄</span>
            <span class="tab-label">Details</span>
        </button>
        <button class="nav-tab" onclick="switchMobileTab('chat')">
            <span class="tab-icon">💬</span>
            <span class="tab-label">Assistant</span>
        </button>
    </div>

    <!-- Add Tool Modal -->
    <div class="modal-overlay" id="addToolModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Add Custom Tool</h3>
                <button class="close-modal" onclick="closeAddToolModal()">&times;</button>
            </div>
            <form id="addToolForm" onsubmit="submitNewTool(event)">
                <div class="form-group">
                    <label for="toolName">Tool Name</label>
                    <input type="text" id="toolName" placeholder="e.g., Maltego" required>
                </div>
                <div class="form-group">
                    <label for="toolLink">Tool Link (URL)</label>
                    <input type="url" id="toolLink" placeholder="e.g., https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="toolCategory">Category</label>
                    <div style="display: flex; gap: 8px;">
                        <select id="toolCategory" required style="flex-grow: 1;">
                            <option value="OSINT">🔍 OSINT & Attack Surface</option>
                            <option value="Threat-Intel">🛰️ Threat Intelligence</option>
                            <option value="Network">🌐 Network & DNS Recon</option>
                            <option value="Code-Search">💻 Source Code Search</option>
                            <option value="Wireless">📶 Wireless</option>
                        </select>
                        <button type="button" class="btn" onclick="showNewCategoryForm()" style="padding: 10px; white-space: nowrap; font-size: 0.85rem;">➕ New Category</button>
                    </div>
                    <div id="newCategoryGroup" style="display: none; background: rgba(255,255,255,0.03); padding: 12px; border-radius: 6px; border: 1px dashed var(--border-dim); margin-top: 10px;">
                        <div style="margin-bottom: 8px;">
                            <label for="newCategoryName" style="margin-bottom: 4px;">New Category Name</label>
                            <input type="text" id="newCategoryName" placeholder="e.g., Social Media" style="width: 100%;">
                        </div>
                        <div style="margin-bottom: 12px;">
                            <label for="newCategoryIcon" style="margin-bottom: 4px;">Category Icon (Emoji)</label>
                            <input type="text" id="newCategoryIcon" placeholder="e.g., 📱" style="width: 100%;">
                        </div>
                        <div style="display: flex; gap: 8px; justify-content: flex-end;">
                            <button type="button" class="btn" onclick="cancelNewCategory()" style="font-size: 0.8rem; padding: 6px 12px;">Cancel</button>
                            <button type="button" class="btn btn-primary" onclick="saveNewCategory()" style="font-size: 0.8rem; padding: 6px 12px;">Save Category</button>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="toolBrief">Simple Explanation (What is it?)</label>
                    <textarea id="toolBrief" placeholder="Explain what the tool does in simple terms..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="toolUse">How to Use It</label>
                    <textarea id="toolUse" placeholder="Provide step-by-step instructions or usage examples..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="toolUseful">Why Hackers Care About This</label>
                    <textarea id="toolUseful" placeholder="Explain the security value or hacker perspective..." required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" onclick="closeAddToolModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Tool</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/config.js?v=3.5"></script>
    <script src="../js/OSINT.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/resizer.js"></script>
</body>

</html>
