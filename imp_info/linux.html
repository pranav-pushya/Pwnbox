<!DOCTYPE html>
<html lang="en">

<head>
    <script src="../js/auth_guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Most Used Linux Commands // PwnBox Academy Mind Map</title>
    <link rel="icon" type="image/svg+xml" href="../assets/favicon-guide.svg">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Work+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Theme Initialization -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/imp_info.css">
    <link rel="stylesheet" href="../css/linux_mindmap.css">
    <script src="../js/theme.js"></script>
    <script src="../js/ui_popups.js"></script>
</head>

<body class="linux-fullscreen-body">

    <!-- Red Cross Close Button at Top Right Corner -->
    <button class="mindmap-fullscreen-close" id="mindmapFullscreenClose" onclick="closeLinuxFullscreen()" title="Close / Return to Previous Page (ESC)">✕</button>

    <!-- Floating Top-Left Command Search & Intel HUD -->
    <div class="mindmap-floating-hud">
        <div class="hud-brand-pill">
            <span class="hud-brand-dot"></span>
            <span class="hud-brand-text">LINUX COMMANDS // MIND MAP</span>
        </div>

        <div class="hud-search-row">
            <div class="search-box-wrap">
                <span class="search-input-icon">🔍</span>
                <input type="text" id="linuxSearchInput" class="linux-search-input" placeholder="Search commands, flags, descriptions..." autocomplete="off" spellcheck="false">
                <button class="search-clear-btn" id="searchClearBtn" title="Clear Search">✕</button>
            </div>
            <div class="hud-stat-pill" id="searchMatchCount">70 COMMANDS</div>
        </div>

        <!-- Category Filter Chips Bar -->
        <div class="category-filter-chips" id="categoryFilterChips">
            <!-- Dynamically populated by JS -->
        </div>

        <!-- Secondary Actions -->
        <div class="hud-actions-row">
            <button class="btn-cyber active" id="btnViewMindMap" title="Mind Map View">🗺️ Mind Map</button>
            <button class="btn-cyber" id="btnViewGrid" title="Switch to Grid View">📊 Grid</button>
            <button class="btn-cyber" id="btnExportCheatSheet" title="Export Markdown Cheat Sheet">📋 Export All</button>
        </div>
    </div>

    <!-- ==========================================================================
         FULLSCREEN MIND MAP VIEWPORT (COVERS ENTIRE SCREEN 100vw x 100vh)
         ========================================================================== -->
    <div class="mindmap-viewport-wrapper" id="mindmapWrap">
        <!-- Background Matrix Grid -->
        <div class="mindmap-canvas-bg-grid"></div>

        <!-- Controllable Pan/Zoom Canvas Surface -->
        <div class="mindmap-surface" id="mindmapSurface">
            <!-- SVG Connector Layer for Center Rays & Branch Curves -->
            <svg class="mindmap-svg-layer" id="mindmapSvgLayer" viewBox="0 0 1720 1380"></svg>

            <!-- Center Tux Penguin Hub Badge (ONLY LOGO AT CENTRE, COVERS THE DOTTED CIRCLE) -->
            <div class="mindmap-center-hub" id="centerTuxHub" title="Linux Tux Core Architecture">
                <div class="tux-outer-ring"></div>
                <div class="tux-circle-badge">
                    <img src="../assets/tux_badge.png" alt="Linux Tux Logo">
                </div>
            </div>

            <!-- 12 Category Boxes & Command Capsules will be rendered here by JS -->
        </div>

        <!-- Floating Navigation & Zoom HUD (Bottom-Right) -->
        <div class="mindmap-hud-controls">
            <button class="hud-btn" onclick="zoomMindMap(0.12)" title="Zoom In (+)">＋</button>
            <button class="hud-btn" onclick="zoomMindMap(-0.12)" title="Zoom Out (-)">－</button>
            <button class="hud-btn" onclick="centerView()" title="Center Mind Map">🎯</button>
            <button class="hud-btn" onclick="fitToScreen()" title="Fit to Screen">📐</button>
        </div>

        <!-- Floating Interaction Hint (Bottom-Left) -->
        <div class="mindmap-hud-hint">
            <span>🖱️ DRAG TO PAN</span>
            <span>•</span>
            <span>📜 SCROLL TO ZOOM</span>
            <span>•</span>
            <span>📋 CLICK ANY COMMAND TO COPY & TEST</span>
        </div>
    </div>

    <!-- Alternative Grid View Modal/Drawer if clicked -->
    <div class="linux-grid-overlay" id="linuxGridOverlay">
        <div class="linux-grid-modal-body">
            <div class="linux-grid-header">
                <h2>// ALL LINUX COMMANDS DIRECTORY</h2>
                <button class="btn-cyber" onclick="toggleGridView(false)">✕ Close Grid</button>
            </div>
            <div class="linux-grid-view active" id="linuxGridView">
                <!-- Populated dynamically -->
            </div>
        </div>
    </div>

    <!-- ==========================================================================
         INTERACTIVE LIVE TERMINAL SANDBOX MODAL
         ========================================================================== -->
    <div class="terminal-sandbox-modal" id="terminalModal" role="dialog" aria-modal="true" aria-label="Terminal Simulator">
        <div class="terminal-window">
            <div class="terminal-header">
                <div class="terminal-dots">
                    <span class="dot dot-red"></span>
                    <span class="dot dot-yellow"></span>
                    <span class="dot dot-green"></span>
                </div>
                <div class="terminal-title">PWNBOX TERMINAL SANDBOX // BASH 5.2</div>
                <button class="terminal-close-btn" id="terminalCloseBtn" title="Close (ESC)">✕</button>
            </div>

            <div class="terminal-intel-bar">
                <span class="intel-category-badge" id="terminalCatBadge">// CATEGORY</span>
                <div class="intel-cmd-name" id="terminalCmdName">COMMAND</div>
                <div class="intel-cmd-desc" id="terminalCmdDesc">Description of command</div>
                <div class="intel-cmd-flags" id="terminalCmdFlags">Flags & options breakdown</div>
            </div>

            <div class="terminal-screen" id="terminalOutputScreen"></div>

            <div style="background:#090d16; padding: 10px 20px; border-top: 1px solid #1a2538; display: flex; align-items: center; gap: 8px;">
                <span style="color:#00ff66; font-family:'Space Mono', monospace; font-size:0.85rem; font-weight:bold;">analyst@pwnbox:~$</span>
                <input type="text" id="terminalCliInput" style="flex:1; background:none; border:none; color:#f1f5f9; font-family:'Space Mono', monospace; font-size:0.88rem; outline:none;" placeholder="Type a command (ls, whoami, uname -a, clear) and press Enter..." autocomplete="off" spellcheck="false">
            </div>

            <div class="terminal-footer-actions">
                <button class="btn-cyber" id="btnTerminalCopyCmd">📋 Copy Command</button>
                <button class="btn-cyber" onclick="closeTerminalSimulator()">Done</button>
            </div>
        </div>
    </div>

    <!-- Floating Toast Notification -->
    <div id="linuxToast" class="linux-toast">COPIED TO CLIPBOARD</div>

    <!-- Scripts -->
    <script src="../js/linux_mindmap.js"></script>
</body>

</html>
